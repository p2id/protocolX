name: Deploy Leisure Loop
on:
  push:
    branches: [main]
    paths:
      - 'docs/leisure-loop/**'
      - '.github/workflows/deploy-leisure-loop.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/leisure-loop
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
